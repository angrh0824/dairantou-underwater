# 声のAI中継 ＋ アカウント・持ち物・決済。デプロイ: このフォルダで npx wrangler deploy（手順は README.md）
# 秘密の値はファイルに書かず、npx wrangler secret put で登録する:
#   OPENROUTER_API_KEY     声のAI（使うときだけ）の OpenRouter のキー
#   STRIPE_SECRET_KEY      Stripe のシークレットキー（テスト中は sk_test_ で始まるもの）
#   STRIPE_WEBHOOK_SECRET  Stripe の webhook の署名シークレット（whsec_ で始まるもの）
name = "dairantou-voice"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# アカウントと持ち物のデータベース。npx wrangler d1 create dairantou で作り、出てきた database_id をここに貼る
[[d1_databases]]
binding = "DB"
database_name = "dairantou"
database_id = "ここに database_id を貼る"

[vars]
# 聞き方とモデル
#   Jev（判断モデル）:      API = "decisions" / MODEL = "typesafe/jev-1.14"
#   Claude Haiku（文章）:  API = "chat"      / MODEL = "anthropic/claude-haiku-5.5"
#   Jev Router（文章）:    API = "chat"      / MODEL = "typesafe/jev-router"
API = "decisions"
MODEL = "typesafe/jev-1.14"
# 試合中のぼやき（1試合3〜5回）を書く軽い文章モデル
GRUMBLE_MODEL = "deepseek/deepseek-v4.1-flash-1017"
# ゲームのページのアドレス（カンマ区切り）。localhost の2つは手元で試すためのもので、公開するときは消してかまいません
ALLOWED_ORIGINS = "https://angrh0824.github.io,http://localhost:8765,http://127.0.0.1:8765"
RATE_PER_MIN = "30"
TIMEOUT_MS = "6000"
# 支払いが終わったあとに戻ってくるゲームのページ
GAME_URL = "https://angrh0824.github.io/dairantou-underwater/"
